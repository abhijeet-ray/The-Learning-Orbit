<!-- topics/templates/topics/grade_subjects_list.html -->
{% extends "topics/base.html" %}
{% block title %}{{ grade_name }} Subjects | The Learning Orbit{% endblock %}
{% block content %}
<div class="container mx-auto p-8 text-white">
    <header class="text-center my-12">
        <h1 class="text-5xl font-bold">{{ grade_name }}</h1>
        <p class="text-xl text-gray-300 mt-2">Select a subject to explore.</p>
    </header>
    <main class="max-w-4xl mx-auto">
        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
            {% for subject in subjects_list %}
                <a href="{% url 'subject_topics' grade_slug=grade_slug subject_slug=subject|slugify %}" class="block p-8 bg-gray-800/50 backdrop-blur-sm rounded-lg shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 text-center border border-gray-700 hover:border-purple-500">
                    <h3 class="text-2xl font-bold text-purple-400">{{ subject }}</h3>
                </a>
            {% endfor %}
        </div>
        <div class="text-center mt-12">
            <a href="{% url 'k12_galaxy' %}" class="text-blue-400 hover:underline">&larr; Back to Grade Selection</a>
        </div>
    </main>
</div>
{% endblock %}
