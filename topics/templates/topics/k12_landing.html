<!-- topics/templates/topics/k12_landing.html -->
{% extends "topics/base.html" %}
{% block title %}K-12 Galaxy | The Learning Orbit{% endblock %}
{% block content %}
<div class="container mx-auto p-8 text-white">
    <header class="text-center my-12">
        <h1 class="text-5xl font-bold">K-12 Galaxy</h1>
        <p class="text-xl text-gray-300 mt-2">Select your grade to begin your learning mission.</p>
    </header>
    <main class="max-w-4xl mx-auto">
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {% for grade in grade_levels %}
                <a href="{% url 'grade_subjects' grade_slug=grade|slugify %}" class="block p-8 bg-gray-800/50 backdrop-blur-sm rounded-lg shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 text-center border border-gray-700 hover:border-blue-500">
                    <h3 class="text-2xl font-bold text-blue-400">{{ grade }}</h3>
                </a>
            {% endfor %}
        </div>
    </main>
</div>
{% endblock %}
