<!-- topics/templates/topics/topic_detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic.title }} - The Learning Orbit</title>
    <!-- This script loads Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto mt-10 p-6 bg-white rounded-lg shadow-lg">

        <!-- Header Section -->
        <div class="border-b pb-4 mb-6">
            <h1 class="text-4xl font-bold text-gray-800">{{ topic.title }}</h1>
            <p class="text-lg text-gray-500 mt-2">
                <span class="font-semibold">{{ topic.subject }}</span> | 
                <span class="font-semibold">{{ topic.grade_level }}</span>
            </p>
        </div>

        <!-- Main Content Body -->
        <div class="prose max-w-none text-gray-700">
            <!-- The 'safe' filter is important for rendering HTML content from the database securely -->
            {{ topic.content_body|safe }}
        </div>

        <!-- Badge Section -->
        <div class="mt-8 pt-4 border-t">
            <p class="text-md text-gray-600">
                Complete this topic to earn the 
                <span class="font-bold text-blue-600 py-1 px-2 bg-blue-100 rounded-md">🏆 {{ topic.badge_name }}</span> 
                badge!
            </p>
        </div>

    </div>

</body>
</html>
